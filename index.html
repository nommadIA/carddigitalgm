<style>
  /* Base - Limpo e sem efeitos */
  .app-bg {
    background: var(--gm-bg);
    min-height: 100vh;
  }
  
  /* “Frame” de preview */
  .frame {
    margin: 0 auto;
    width: 100%;
    transition: max-width .18s ease;
  }
  .frame-mobile  { max-width: 430px; }
  .frame-tablet  { max-width: 900px; }
  .frame-desktop { max-width: 100%; }

  .frame-outline {
    border: 1px solid var(--gm-border);
    border-radius: 18px;
    overflow: hidden;
  }

  /* SPLASH SCREEN STYLES (Modern & Neon) */
  #gm-splash {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0e14;
    overflow: hidden;
  }

  /* Neon Pulse Background */
  #gm-splash::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(255, 122, 0, 0.12) 0%, transparent 60%);
    animation: neonPulse 3s ease-in-out infinite;
  }

  @keyframes neonPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.3); opacity: 0.8; }
  }

  .gm-card-splash {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardEntrance {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .gm-logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .gm-logo-box {
    width: 110px;
    height: 110px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The actual logo image */
  .gm-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 28px;
    position: relative;
    z-index: 2;
    /* Remove background and shadow from the image itself so it blends */
    background: transparent; 
  }

  /* Container for the rotating border to allow masking */
  .gm-logo-border-wrapper {
    position: absolute;
    inset: -2px; /* Thinner border */
    border-radius: 30px; /* Match logo radius + inset */
    overflow: hidden;
    z-index: 1;
  }

  /* The rotating gradient */
  .gm-logo-border-wrapper::before {
    content: '';
    position: absolute;
    inset: -50%; /* Make it large enough to cover the corners when rotating */
    background: conic-gradient(
      from 0deg, 
      transparent 0%, 
      transparent 70%, 
      rgba(255, 204, 0, 0.1) 80%,
      #ffcc00 92%, 
      #ff5500 100% /* Saturated orange tip */
    );
    animation: rotateTrail 1.3s linear infinite;
  }

  /* The mask to create the border line */
  .gm-logo-border-wrapper::after {
    content: '';
    position: absolute;
    inset: 1.5px; /* Thickness of the border - very thin */
    background: #0b0e14; /* Match the splash background */
    border-radius: 28.5px; /* Match logo radius */
  }

  /* The blurred glow of the trail */
  .gm-logo-glow-wrapper {
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    overflow: hidden;
    z-index: 0;
    filter: blur(6px);
    opacity: 0.9;
  }

  .gm-logo-glow-wrapper::before {
    content: '';
    position: absolute;
    inset: -50%;
    background: conic-gradient(
      from 0deg, 
      transparent 0%, 
      transparent 70%, 
      rgba(255, 204, 0, 0.1) 80%,
      #ffcc00 92%, 
      #ff5500 100% /* Saturated orange tip */
    );
    animation: rotateTrail 1.3s linear infinite;
  }

  .gm-logo-glow-wrapper::after {
    content: '';
    position: absolute;
    inset: 1.5px;
    background: #0b0e14;
    border-radius: 28.5px;
  }

  @keyframes rotateTrail {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .gm-splash-title {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 32px;
    color: #fff;
    margin: 0;
    letter-spacing: -0.04em;
    display: flex;
    flex-direction: row;
    align-items: center;
    line-height: 1;
    gap: 8px;
    white-space: nowrap;
  }

  .gm-splash-title span.light {
    font-weight: 300;
    color: #f8fafc;
  }

  .gm-splash-title span.bold {
    font-weight: 600;
    color: #ff7a00;
    text-shadow: 0 0 20px rgba(255, 122, 0, 0.4);
  }

  .gm-sub-container {
    margin-top: 24px;
  }

  .gm-sub {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* Modern Loading Bar */
  .gm-bar {
    height: 2px; /* Thinner */
    width: 120px;
    margin: 16px auto 0;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .gm-bar span {
    display: block;
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255, 204, 0, 0.4), #ffcc00, #ff5500);
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.6), 0 0 8px rgba(255, 85, 0, 0.8);
    animation: gmLoad 1.3s infinite ease-in-out;
    border-radius: 10px;
  }

  @keyframes gmLoad {
    0% { transform: translateX(-150%); }
    100% { transform: translateX(250%); }
  }
</style>

  <script>
    (function () {
      function hideSplash() {
        var el = document.getElementById("gm-splash");
        if (!el) return;
        
        // Wait 2.5 seconds before starting the fade out
        setTimeout(function() {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.5s ease-in-out';
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 500);
        }, 2500);
      }
  
      window.__GM_APP_READY__ = function () { hideSplash(); };
  
      window.__GM_SPLASH_STATUS__ = function (text) {
        var p = document.getElementById("gm-splash-sub");
        if (p) p.textContent = text;
      };
  
      window.__GM_SPLASH_SET_USER__ = function (name, avatarUrl) {
        var u = document.getElementById("gm-splash-user");
        if (u) u.textContent = name ? ("Bem-vindo, " + name) : "";
  
        var img = document.getElementById("gm-splash-avatar");
        if (img && avatarUrl) {
          img.src = avatarUrl;
        }
      };
  
      setTimeout(function () { hideSplash(); }, 8000);
    })();
  </script>
