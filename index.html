    <meta charset="UTF-8" />

    />

    <link
      rel="apple-touch-icon"
      href="https://hbvqfpqnuzvzcvhnickt.supabase.co/storage/v1/object/public/brand_assets_logo/FIVE%20ICON%20CARDDIGITAL%20GM.svg"
    />

    <meta name="theme-color" content="#ff7a00" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Mapeia para variáveis CSS dinâmicas
              primary: 'var(--gm-primary)', 
              'primary-weak': 'var(--gm-primary-weak)',
              secondary: 'var(--gm-accent)', 
              'secondary-weak': 'var(--gm-accent-weak)',
              success: '#22c55e', 
              dark: {
                bg: 'var(--gm-bg)',
                card: 'var(--gm-surface)',
                text: 'var(--gm-text)'
              }
            },
            fontFamily: {
              sans: ['var(--gm-font)', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- PWA Manifest Placeholder -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  /* Base - Limpo e sem efeitos */
  .app-bg {
    background: var(--gm-bg);
    min-height: 100vh;
  }
  
  /* “Frame” de preview */
  .frame {
    margin: 0 auto;
    width: 100%;
    transition: max-width .18s ease;
  }
  .frame-mobile  { max-width: 430px; }
  .frame-tablet  { max-width: 900px; }
  .frame-desktop { max-width: 100%; }

  .frame-outline {
    border: 1px solid var(--gm-border);
    border-radius: 18px;
    overflow: hidden;
  }

  /* SPLASH SCREEN STYLES (Modern & Light) */
  #gm-splash {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0e14;
    animation: splashFadeIn 0.5s ease-out;
  }

  @keyframes splashFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .gm-card-splash {
    width: min(400px, 90vw);
    border-radius: 24px;
    padding: 40px;
    background: rgba(22, 27, 34, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardEntrance {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .gm-logo-box {
    width: 100px;
    height: 100px;
    margin: 0 auto 24px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #1c2128 0%, #0d1117 100%);
    border: 1px solid rgba(255, 122, 0, 0.2);
    position: relative;
    box-shadow: 0 0 30px rgba(255, 122, 0, 0.1);
    animation: logoEntrance 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes logoEntrance {
    0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .gm-logo-box::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    background: linear-gradient(45deg, transparent, rgba(255, 122, 0, 0.3), transparent);
    animation: borderRotate 3s linear infinite;
    z-index: -1;
  }

  @keyframes borderRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .gm-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 24px;
    padding: 4px;
  }

  .gm-title {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    margin: 0;
    letter-spacing: -0.02em;
    background: linear-gradient(to bottom, #fff, #8b949e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textEntrance 0.8s ease-out 0.2s both;
  }

  @keyframes textEntrance {
    from { transform: translateY(10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .gm-sub {
    margin-top: 10px;
    font-size: 14px;
    color: #8b949e;
    font-weight: 500;
    animation: textEntrance 0.8s ease-out 0.4s both;
  }

  /* Modern Loading Bar */
  .gm-bar {
    height: 3px;
    width: 140px;
    margin: 32px auto 0;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .gm-bar span {
    display: block;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #ff7a00, transparent);
    animation: gmLoad 2s infinite cubic-bezier(0.65, 0, 0.35, 1);
  }

  @keyframes gmLoad {
    0% { transform: translateX(-150%); }
    100% { transform: translateX(250%); }
  }

  .gm-hide {
    display: none !important;
  }

  .gm-hide{
    display: none !important;
  }
</style>

<link rel="stylesheet" href="/index.css">
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",

    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",

    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3",
    "qrcode": "https://esm.sh/qrcode@^1.5.4",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "pdf-lib": "https://esm.sh/pdf-lib@^1.17.1",

</head>
  <body class="bg-app text-muted transition-colors duration-200">
    
    <div id="gm-splash">
      <div class="gm-card-splash">
        <div class="gm-logo-box">
          <img
            id="gm-splash-avatar"
            class="gm-logo"
            src="https://hbvqfpqnuzvzcvhnickt.supabase.co/storage/v1/object/public/brand_assets_logo/FIVE%20ICON%20CARDDIGITAL%20GM.svg"
            alt="CardDigital GM Pro"
          />
        </div>
    
        <h1 class="gm-title" id="gm-splash-title">CardDigital GM Pro</h1>
    
        <p class="gm-sub" id="gm-splash-sub">Carregando...</p>
    
        <p class="gm-sub" style="margin-top:6px; font-size:12px; opacity:.85">
          <span id="gm-splash-user"></span>
        </p>
    
        <div class="gm-bar"><span></span></div>
      </div>
    </div>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <script>
    (function () {
      function hideSplash() {
        var el = document.getElementById("gm-splash");
        if (!el) return;
        // Simple fade out or just remove
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 200);
      }
  
      window.__GM_APP_READY__ = function () { hideSplash(); };
  
      window.__GM_SPLASH_STATUS__ = function (text) {
        var p = document.getElementById("gm-splash-sub");
        if (p) p.textContent = text;
      };
  
      window.__GM_SPLASH_SET_USER__ = function (name, avatarUrl) {
        var u = document.getElementById("gm-splash-user");
        if (u) u.textContent = name ? ("Bem-vindo, " + name) : "";
  
        var img = document.getElementById("gm-splash-avatar");
        if (img && avatarUrl) {
          img.src = avatarUrl;
        }
      };
  
      setTimeout(function () { hideSplash(); }, 8000);
    })();
  </script>
</body>
</html>
