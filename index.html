<style>
  /* Base - Limpo e sem efeitos */
  .app-bg {
    background: var(--gm-bg);
    min-height: 100vh;
  }
  
  /* “Frame” de preview */
  .frame {
    margin: 0 auto;
    width: 100%;
    transition: max-width .18s ease;
  }
  .frame-mobile  { max-width: 430px; }
  .frame-tablet  { max-width: 900px; }
  .frame-desktop { max-width: 100%; }

  .frame-outline {
    border: 1px solid var(--gm-border);
    border-radius: 18px;
    overflow: hidden;
  }

  /* SPLASH SCREEN STYLES (Modern & Neon) */
  #gm-splash {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0e14;
    overflow: hidden;
  }

  /* Dotted Grid Background - AI Effect with Directional Opacity Mask */
  .gm-dotted-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(var(--grid-cols, 40), 24px);
    grid-template-rows: repeat(var(--grid-rows, 30), 24px);
    justify-content: center;
    align-content: center;
    width: 100%;
    height: 100%;
    opacity: 0.95;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
    /* Soft vignette directional grid mask, beautiful organic fadeout on screen edges */
    mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 30%, rgba(0, 0, 0, 0.4) 75%, rgba(0, 0, 0, 0) 100%);
    -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 30%, rgba(0, 0, 0, 0.4) 75%, rgba(0, 0, 0, 0) 100%);
  }

  .gm-grid-dot {
    width: 1.2px;
    height: 1.2px;
    background-color: rgba(255, 255, 255, 0.04); /* Super discrete dark gray/white point */
    border-radius: 50%;
    place-self: center;
    animation: dotAmbient 4.5s infinite linear;
  }

  /* Ambient Grid Breathing - No scale, pure directional opacity sweep mimicking the elegant Magnific space dots */
  @keyframes dotAmbient {
    0% {
      opacity: 0.12;
      background-color: rgba(255, 255, 255, 0.04);
    }
    15% {
      opacity: 0.72;
      background-color: rgba(255, 255, 255, 0.28); /* Warm grey elegant highlight */
    }
    35%, 100% {
      opacity: 0.12;
      background-color: rgba(255, 255, 255, 0.04);
    }
  }

  .gm-card-splash {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardEntrance {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .gm-logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .gm-logo-box {
    width: 104px;
    height: 104px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 26px;
  }

  /* Ambient soft glow */
  .gm-logo-glow-wrapper {
    position: absolute;
    inset: -6px;
    border-radius: 30px;
    background: radial-gradient(
      circle, 
      rgba(255, 122, 0, 0.45) 0%, 
      rgba(255, 122, 0, 0.12) 50%, 
      transparent 75%
    );
    filter: blur(12px);
    z-index: 0;
    pointer-events: none;
    animation: pulseLogoGlow 3s ease-in-out infinite alternate;
  }

  @keyframes pulseLogoGlow {
    0% { opacity: 0.5; transform: scale(0.96); }
    100% { opacity: 0.95; transform: scale(1.04); }
  }

  /* The actual logo image */
  .gm-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    position: relative;
    z-index: 2;
    background: transparent; 
  }

  /* Container for the rotating border */
  .gm-logo-border-wrapper {
    position: absolute;
    inset: -3px;
    border-radius: 25px;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(255, 122, 0, 0.7));
  }

  /* The rotating gradient trail */
  .gm-logo-border-wrapper::before {
    content: '';
    position: absolute;
    inset: -60%;
    background: conic-gradient(
      from 0deg, 
      transparent 0%, 
      transparent 65%, 
      rgba(255, 122, 0, 0.25) 75%,
      #ffcc00 92%, 
      #ff7a00 100%
    );
    animation: rotateTrail 2s linear infinite;
  }

  /* The inner mask creating precision thin contour */
  .gm-logo-border-wrapper::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: #0b0e14;
    border-radius: 23px;
    z-index: 1;
  }

  @keyframes rotateTrail {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .gm-splash-title {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 32px;
    color: #fff;
    margin: 0;
    letter-spacing: -0.04em;
    display: flex;
    flex-direction: row;
    align-items: center;
    line-height: 1;
    gap: 8px;

  .gm-splash-title span.light {

  .gm-splash-title span.bold {

    color: #94a3b8;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.85;
  }
</style>

  <script>
    (function () {
      var isReactReady = false;
      var isAnimationFinished = false;
      var splashEl = document.getElementById("gm-splash");
      var subEl = document.getElementById("gm-splash-sub");

      var isBioRoute = window.location.href.indexOf('/bio') !== -1 || window.location.hash.indexOf('/bio') !== -1;

      if (isBioRoute) {
        if (splashEl) {
          splashEl.style.display = 'none';
          try {
            if (splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
          } catch (e) {}
        }
        isReactReady = true;
        isAnimationFinished = true;
      }

      // Generates the subtle AI dotted background grid using high-performance GPU canvas
      function createDottedGrid() {
        var splash = document.getElementById("gm-splash");
        if (!splash) return;
        
        var canvas = document.createElement("canvas");
        canvas.id = "gm-dotted-canvas";
        canvas.className = "gm-dotted-grid";
        
        splash.insertBefore(canvas, splash.firstChild);
        
        var ctx = canvas.getContext("2d", { alpha: true });
        if (!ctx) return;
        
        var width = window.innerWidth;
        var height = window.innerHeight;
        
        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          var dpr = window.devicePixelRatio || 1;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx.scale(dpr, dpr);
        }
        
        resize();
        window.addEventListener("resize", resize);
        
        var animationId;
        
        function draw() {
          if (!canvas.parentNode) {
            cancelAnimationFrame(animationId);
            return;
          }
          
          ctx.clearRect(0, 0, width, height);
          
          var time = performance.now() * 0.001;
          var spacing = 24; // Spacing matching Magnific
          
          var cols = Math.ceil(width / spacing) + 1;
          var rows = Math.ceil(height / spacing) + 1;
          
          var offsetX = (width - (cols - 1) * spacing) / 2;
          var offsetY = (height - (rows - 1) * spacing) / 2;
          
          ctx.fillStyle = "#ffffff";
          
          for (var c = 0; c < cols; c++) {
            for (var r = 0; r < rows; r++) {
              var x = offsetX + c * spacing;
              var y = offsetY + r * spacing;
              
              // Elegant diagonal wave phase delay mimicking Magnific transition rhythm
              var val = Math.sin(time * 1.5 - (c + r) * 0.15);
              
              // Map sin from [-1, 1] to a highly focused peak
              var intensity = val > 0 ? val : 0;
              // Exponential intensity for the focused elegant peak (val ^ 4)
              var intensitySq = intensity * intensity;
              var intensityQuad = intensitySq * intensitySq;
              
              // Discrete highlight effect
              var opacity = 0.035 + intensityQuad * 0.22;
              
              ctx.globalAlpha = opacity;
              // Pixel-perfect tiny dots
              ctx.fillRect(x - 0.6, y - 0.6, 1.2, 1.2);
            }
          }
          
          animationId = requestAnimationFrame(draw);
        }
        
        draw();
        
        // Clean up listeners when canvas is removed
        var observer = new MutationObserver(function(mutations) {
          if (!document.body.contains(canvas)) {
            window.removeEventListener("resize", resize);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      // Initialize dotted grid immediately for maximum visual impact as page loads
      try {
        if (!isBioRoute) {
          createDottedGrid();
        }
      } catch (e) {
        console.error("Dotted grid init failed", e);
      }

      function attemptHide() {
        if (isReactReady && isAnimationFinished) {
          if (splashEl) {
            splashEl.style.opacity = '0';
            splashEl.style.transition = 'opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            setTimeout(function () {
              if (splashEl && splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
            }, 400);
          }
        }
      }

      // Typewriter Effect
      var textToType = "Sincronizando Informação...";
      var currentText = "";
      var i = 0;
      var typingSpeed = 65; // ms por letra (um pouco mais lento e elegante)
      var erasingSpeed = 25; // ms por letra para apagar rápido
      var holdDelay = 650; // pausa antes de apagar para poder ler

      function type() {
        if (i < textToType.length) {
          currentText += textToType.charAt(i);
          if (subEl) subEl.innerHTML = currentText + '<span class="animate-pulse" style="color: var(--gm-primary); margin-left:1px; font-weight:bold;">|</span>';
          i++;
          setTimeout(type, typingSpeed);
        } else {
          // Terminou de digitar. Pausa e depois apaga.
          setTimeout(function() {
            erase();
          }, holdDelay);
        }
      }

      function erase() {
        if (i > 0) {
          currentText = currentText.slice(0, -1);
          if (subEl) subEl.innerHTML = currentText + '<span class="animate-pulse" style="color: var(--gm-primary); margin-left:1px; font-weight:bold;">|</span>';
          i--;
          setTimeout(erase, erasingSpeed);
        } else {
          if (subEl) subEl.textContent = "";
          isAnimationFinished = true;
          attemptHide();
        }
      }

      // Inicia a animação de digitação
      setTimeout(function() {
        if (!isBioRoute) {
          type();
        }
      }, 300);

      window.__GM_APP_READY__ = function () {
        isReactReady = true;
        isAnimationFinished = true;
        attemptHide();
      };

      window.__GM_SPLASH_STATUS__ = function (text) {
        // Custom text overrides can be ignored to preserve typewriter experience
      };

      window.__GM_SPLASH_SET_USER__ = function (name, avatarUrl) {
        var img = document.getElementById("gm-splash-avatar");
        if (img && avatarUrl) {
          img.src = avatarUrl;
        }
      };

      // Fallback de contingência caso trave por qualquer motivo
      setTimeout(function () {
        isReactReady = true;
        isAnimationFinished = true;
        attemptHide();
      }, isBioRoute ? 0 : 6500);
    })();
  </script>
